name: Release

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Versionize
      run: dotnet tool install --global Versionize

    - name: Setup git
      run: |
        git config --global user.email opencommissioning@spiratec.com
        git config --global user.name "oc-bot"

    - name: Versioning
      id: versionize
      run: versionize --exit-insignificant-commits

    - name: Get current version
      run: echo "VERSION=v$(versionize inspect)" >> "$GITHUB_ENV"

    - name: Get current changelog
      run: versionize changelog > latest_changelog.md

    - name: Dotnet build
      run: dotnet build OC.OfficeLite --configuration release --output ./Publish

    - name: Zip artifacts
      run: |
        mkdir OC.OfficeLite
        mv OC.OfficeLite.dll OC.OfficeLite/
        mv Config.plugin OC.OfficeLite/
        zip -r "OC.OfficeLite_$VERSION.zip" OC.OfficeLite
      working-directory: Publish

    - name: Push changes to GitHub
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        tags: true

    - name: Publish new release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "$VERSION" -t "Release $VERSION" -F latest_changelog.md
        gh release upload "$VERSION" "./Publish/OC.OfficeLite_$VERSION.zip"
